name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      # The test suite has zero runtime dependencies, so no install step.
      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      # No package-lock.json is committed, so install (not ci) for the devDeps.
      - name: Install dev dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Lint
        run: npm run lint

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      - name: Assert package.json and manifest versions match
        run: |
          PKG="$(node -p "require('./package.json').version")"
          MAN="$(node -p "require('./extension/manifest.json').version")"
          if [ "$PKG" != "$MAN" ]; then
            echo "::error::package.json version ($PKG) does not match extension/manifest.json version ($MAN). They must stay in lockstep."
            exit 1
          fi
          echo "Versions in sync: $PKG"

  security-scan:
    name: "Security Scan (Trivy: secrets + workflow misconfiguration)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          # No lockfile is committed and the extension ships no runtime
          # dependencies, so Trivy's vulnerability scanner has nothing to
          # resolve. These two are the checks that apply to this repository:
          # committed secrets, and GitHub Actions misconfiguration.
          scanners: "secret,misconfig"
          hide-progress: true
          format: "table"
          # Report-only for now: a new advisory should not turn a contributor's
          # branch red on a transitive finding they cannot fix.
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
