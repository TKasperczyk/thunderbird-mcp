<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çeviri</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      box-sizing: border-box;
      width: 236px;
      margin: 0;
      padding: 10px;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    h1 { margin: 0 0 3px; font-size: 14px; }
    p { margin: 0 0 8px; color: GrayText; font-size: 11px; line-height: 1.3; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button {
      min-height: 30px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 7px;
      padding: 5px 7px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    #aiTranslate { background: #5b5cf0; color: white; }
    #localTranslate { background: ButtonFace; color: ButtonText; }
    #showOriginal {
      width: 100%;
      min-height: 28px;
      margin-top: 6px;
      background: ButtonFace;
      color: ButtonText;
    }
    button:disabled { cursor: progress; opacity: .65; }
    #status { margin-top: 7px; color: GrayText; font-size: 11px; line-height: 1.3; }
    #status:empty { display: none; }
    #status.error { color: #d70022; }
  </style>
</head>
<body>
  <h1>Türkçeye çevir</h1>
  <p>AI daha doğal; yerel çeviri cihazında çalışır.</p>
  <div class="actions">
    <button id="aiTranslate" type="button">AI ile Çevir</button>
    <button id="localTranslate" type="button">Basit Yerel</button>
  </div>
  <button id="showOriginal" type="button">Orijinali Göster</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="translation-popup.js"></script>
</body>
</html>
